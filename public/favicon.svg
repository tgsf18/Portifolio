<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#09090b" stroke="url(#metalRim)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="42" fill="url(#spaceGlow)"/>
  
  <!-- Outer metallic geometric ring -->
  <polygon points="50,14 84,32 84,68 50,86 16,68 16,32" stroke="url(#chromeGrad)" stroke-width="2" fill="none" opacity="0.8"/>
  
  <!-- Stylized Monogram TS -->
  <path d="M 28 32 L 72 32 M 50 32 L 50 72" stroke="url(#chromeGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 38 68 C 45 74, 58 74, 62 66 C 65 60, 52 54, 46 50 C 40 46, 44 38, 52 38" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  
  <!-- Specular flare points -->
  <circle cx="50" cy="32" r="2.5" fill="#ffffff"/>
  <circle cx="50" cy="72" r="2" fill="#38bdf8"/>
</svg>
